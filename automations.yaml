- id: '1687466458223'
  alias: Bedroom AC Turn On
  description: Turn on Bedroom AC if temperature is above 25 C
  trigger:
  - type: temperature
    platform: device
    device_id: a07c558b99ecdd5c8a86fcbe4ae55f49
    entity_id: sensor.bedroom_sensor_temperature
    domain: sensor
    above: 26
  condition:
  - condition: time
    after: '17:00:00'
    before: 03:00:00
  action:
  - service: climate.set_temperature
    data:
      temperature: 24
      hvac_mode: cool
    target:
      entity_id: climate.bedroom_ac
  mode: single
- id: '1687466586887'
  alias: Bedroom AC Turn Off
  description: Turn off Bedroom AC if temperature is below 24 C
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.bedroom_window_contact
    to: 'off'
    from: 'on'
  condition: []
  action:
  - device_id: 3984f540e7f6071e62301e20e0c5e8ff
    domain: climate
    entity_id: climate.bedroom_ac
    type: set_hvac_mode
    hvac_mode: 'off'
  mode: single
