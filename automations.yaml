- id: '1661277650934'
  alias: Fingerprint door unlock
  description: ''
  triggers:
  - entity_id:
    - sensor.door_fingerprint_state
    to: Authorized finger
    trigger: state
  conditions: []
  actions:
  - device_id: f2e3b2d4f107c73ce5930f6ee7f59dd8
    domain: lock
    entity_id: bf758f21fc20c3f2cbad6aa804fc10d8
    type: unlock
  - if:
    - condition: time
      after: '15:30:00'
      before: 00:06:00
    then:
    - type: turn_on
      device_id: aa4a2351d04b3e41e008a592b18ce6d0
      entity_id: light.living_room
      domain: light
    - type: turn_on
      device_id: e92a9d6ed7dd7c7c529c99c5dab77985
      entity_id: light.panel
      domain: light
    - type: turn_on
      device_id: 00678a79a11a96ba977e341d38062f8e
      entity_id: 4a71593a8486950697bfb94b5f7c826f
      domain: light
  mode: single
