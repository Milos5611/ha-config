- id: '1661443607438'
  alias: Auto door lock
  description: ''
  trigger:
  - type: not_opened
    platform: device
    device_id: de471d8d7e38fadfd06a80cc930173b1
    entity_id: binary_sensor.fibaro_door_window_sensor_2_window_door_is_open
    domain: binary_sensor
  condition: []
  action:
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - device_id: f2e3b2d4f107c73ce5930f6ee7f59dd8
    domain: lock
    entity_id: bf758f21fc20c3f2cbad6aa804fc10d8
    type: lock
  mode: single
